[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-traffic-optimizer"
version = "0.1.0"
description = "Decentralised multi-agent reinforcement learning for traffic signal control on a simulated city grid."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mehul Patil" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "orjson>=3.9"]
training = ["PyYAML>=6.0", "matplotlib>=3.8", "tensorboard>=2.16"]
dev = ["pytest>=8.0", "httpx2>=2.0"]

[tool.setuptools.packages.find]
include = ["core*", "training*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
